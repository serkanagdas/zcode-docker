name: zcode

x-arcane:
  icon: zcode
  urls:
    - "https://edoor.taila48207.ts.net:10040"

services:
  zcode:
    image: ghcr.io/serkanagdas/zcode:latest
    container_name: zcode
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3030"
    command:
      - node
      - /opt/zcode/bin/zcode.mjs
      - --web
      - --workspace
      - /projects
      - --host
      - 0.0.0.0
      - --port
      - "3030"
      - --no-open
      - --no-token
    entrypoint: []
    volumes:
      - zcode-data:/home/zcode/.zcode
      - zcode-workspace:/workspace
      - projects:/projects
    networks:
      - default
      - ai-gateway
      - gitlab_default
      - postgres-dev-net
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

volumes:
  zcode-data:
  zcode-workspace:
  projects:
    external: true
    name: openahands_openhands_projects

networks:
  ai-gateway:
    external: true
  gitlab_default:
    external: true
    name: gitlab_default
  postgres-dev-net:
    external: true
    name: postgres-dev-net
