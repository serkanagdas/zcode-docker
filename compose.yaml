name: zcode

x-arcane:
  icon: zcode
  urls:
    - "https://edoor.taila48207.ts.net:10040"

services:
  zcode:
    image: ghcr.io/serkanagdas/zcode:latest
    container_name: zcode
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      ZCODE_WEB_TOKEN: ${ZCODE_WEB_TOKEN:?Define ZCODE_WEB_TOKEN in Arcane stack environment or a local .env file}
    volumes:
      - zcode-data:/home/zcode/.zcode
      - zcode-workspace:/workspace
      - projects:/projects
    networks:
      - default
      - ai-gateway
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

volumes:
  zcode-data:
  zcode-workspace:
  projects:
    external: true
    name: openahands_openhands_projects

networks:
  ai-gateway:
    external: true
